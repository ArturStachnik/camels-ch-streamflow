# Setting 3, from scratch: basin 2319 (alpine, little glacier (> 1800 m, glacier < 5 %)), last 5 training year(s).
# Single-basin LSTM, forcing only, 1500 weight updates. Generated by scripts/make_setting3_configs.py.
experiment_name: scratch_2319_5y
run_dir: runs/setting3
train_basin_file: splits/setting3/basin_2319.txt
validation_basin_file: splits/setting3/basin_2319.txt
test_basin_file: splits/setting3/basin_2319.txt
train_start_date: 01/10/2000
train_end_date: 30/09/2005
validation_start_date: 01/10/2005
validation_end_date: 30/09/2010
test_start_date: 01/10/2010
test_end_date: 30/09/2020
seed: 401
device: cuda:0
validate_every:
validate_n_random_basins: 205
cache_validation_data: true
metrics: [NSE, KGE, FHV, FLV]
save_validation_results: true
model: cudalstm
head: regression
output_activation: linear
hidden_size: 64
initial_forget_bias: 3
output_dropout: 0.4
optimizer: Adam
loss: NSE
learning_rate: {0: 0.001}
batch_size: 256
epochs: 188
clip_gradient_norm: 1
predict_last_n: 1
seq_length: 365
num_workers: 0
log_interval: 10000
log_tensorboard: false
log_n_figures: 0
save_weights_every: 188
dataset: generic
data_dir: data/processed
dynamic_inputs: [precipitation, temperature_min, temperature_mean, 
    temperature_max, rel_sun_dur]
target_variables: [discharge_spec]
clip_targets_to_zero: [discharge_spec]
